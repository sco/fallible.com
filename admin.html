<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fallible Admin</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Trebuchet MS', Arial, Helvetica, sans-serif;
    background: #a2a0ba;
    color: #000;
  }
  .app { max-width: 900px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.3rem; }
  h1 a { color: inherit; text-decoration: none; }
  input, textarea, button, select {
    font-family: inherit;
    font-size: 14px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 6px;
    border: 1px solid #666;
  }
  button {
    padding: 6px 14px;
    cursor: pointer;
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .toolbar input { flex: 1; }
  ul.files {
    list-style: none;
    padding: 0;
    margin: 0;
    background: #fff;
    border: 1px solid #666;
    max-height: 70vh;
    overflow-y: auto;
  }
  ul.files li a {
    display: block;
    padding: 5px 10px;
    text-decoration: none;
    color: #223;
    border-bottom: 1px solid #eee;
  }
  ul.files li a:hover { background: #eef; }
  .dir { color: #888; font-size: 0.85em; }
  textarea.editor {
    width: 100%;
    height: 65vh;
    padding: 10px;
    border: 1px solid #666;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .status { margin-left: auto; font-size: 0.9em; }
  .status + .status { margin-left: 0; }
  .preview {
    background: #fff;
    border: 1px solid #666;
    padding: 10px 16px;
    height: 65vh;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .preview img { max-width: 100%; }
  .status.error { color: #a00; font-weight: bold; }
  .muted { color: #555; font-size: 0.9em; }
  .token-form { background: #fff; border: 1px solid #666; padding: 1rem; max-width: 500px; }
  .token-form p { margin-top: 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="module">
import { html, render, useState, useEffect } from 'https://esm.sh/htm@3.1.1/preact/standalone?deps=preact@10.25.4';
import { marked } from 'https://esm.sh/marked@15.0.6';

const OWNER = 'sco';
const REPO = 'fallible.com';
const BRANCH = 'main';
const POST_DIRS = ['src/posts', 'src/marginal/posts'];

const getToken = () => localStorage.getItem('gh_token') || '';

async function gh(path, opts = {}) {
  const res = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Accept': 'application/vnd.github+json',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      ...opts.headers,
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(`GitHub ${res.status}: ${body.message || res.statusText}`);
  }
  return res.json();
}

async function ghGraphQL(query) {
  const res = await fetch('https://api.github.com/graphql', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ query }),
  });
  if (!res.ok) throw new Error(`GitHub GraphQL ${res.status}: ${res.statusText}`);
  const data = await res.json();
  if (data.errors) throw new Error(`GitHub GraphQL: ${data.errors[0].message}`);
  return data.data;
}

// Frontmatter is YAML, but these posts only use simple scalar values,
// so regex extraction of title/date is sufficient.
function parsePost(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const fm = m ? m[1] : '';
  const body = m ? text.slice(m[0].length) : text;
  const title = (fm.match(/^title:\s*(.+)$/m)?.[1] || '')
    .trim().replace(/^["']|["']$/g, '').replace(/\\"/g, '"');
  const date = (fm.match(/^date:\s*["']?([^"'\n]+)/m)?.[1] || '').trim();
  return { title, date, body, search: `${title}\n${body}`.toLowerCase() };
}

// UTF-8-safe base64 helpers (atob/btoa alone mangle non-ASCII)
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

function newPostTemplate() {
  const now = new Date().toISOString().slice(0, 19);
  return `---\ntitle: ""\ndate: "${now}"\n---\n\n`;
}

function TokenForm({ onSave }) {
  const [value, setValue] = useState('');
  return html`
    <div class="token-form">
      <p>Paste a GitHub personal access token with <b>contents: read/write</b>
      permission on <b>${OWNER}/${REPO}</b>. It is stored only in this
      browser's localStorage.</p>
      <p><input type="password" placeholder="github_pat_…" value=${value}
        onInput=${e => setValue(e.target.value)} /></p>
      <button onClick=${() => value.trim() && onSave(value.trim())}>Save token</button>
    </div>`;
}

function FileList({ files, loaded, onOpen, onNew }) {
  const [filter, setFilter] = useState('');
  const q = filter.toLowerCase();
  const shown = files.filter(f =>
    f.name.toLowerCase().includes(q) || (f.search && f.search.includes(q)));
  return html`
    <div>
      <div class="toolbar">
        <input type="text" placeholder="Filter posts by title or text…" value=${filter}
          onInput=${e => setFilter(e.target.value)} autofocus />
        <button onClick=${onNew}>New post</button>
      </div>
      <p class="muted">${shown.length} of ${files.length} posts${
        loaded < files.length ? ` · loading contents ${loaded}/${files.length}…` : ''}</p>
      <ul class="files">
        ${shown.map(f => html`
          <li key=${f.path}>
            <a href="#" onClick=${e => { e.preventDefault(); onOpen(f.path); }}>
              ${f.title || f.name}
              <span class="dir">
                ${f.date ? f.date.slice(0, 10) : ''}${f.dir.includes('marginal') ? ' · marginal' : ''}
              </span>
            </a>
          </li>`)}
      </ul>
    </div>`;
}

// Polls the Actions API for the workflow run triggered by a saved commit,
// so the UI shows when the live site has actually updated.
function DeployStatus({ sha }) {
  const [state, setState] = useState('waiting for deploy…');
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!sha) return;
    setState('waiting for deploy…'); setFailed(false);
    let stop = false;
    const started = Date.now();
    async function poll() {
      if (stop) return;
      try {
        const data = await gh(`/repos/${OWNER}/${REPO}/actions/runs?head_sha=${sha}`);
        const run = data.workflow_runs?.[0];
        if (run?.status === 'completed') {
          if (run.conclusion === 'success') {
            setState(`live ${new Date(run.updated_at).toLocaleTimeString()} ✓`);
          } else {
            setState(`deploy ${run.conclusion}`); setFailed(true);
          }
          return;
        }
        if (run) setState(`deploy ${run.status.replace('_', ' ')}…`);
      } catch { /* transient poll errors: keep trying */ }
      if (Date.now() - started < 3 * 60 * 1000) setTimeout(poll, 4000);
      else { setState('deploy status timed out'); setFailed(true); }
    }
    poll();
    return () => { stop = true; };
  }, [sha]);
  if (!sha) return null;
  return html`<span class=${failed ? 'status error' : 'status'}>${state}</span>`;
}

function Editor({ path, isNew, onBack, onSaved }) {
  const [text, setText] = useState(isNew ? newPostTemplate() : null);
  const [sha, setSha] = useState(null);
  const [filename, setFilename] = useState(isNew ? '' : path);
  const [status, setStatus] = useState('');
  const [error, setError] = useState('');
  const [preview, setPreview] = useState(false);
  const [deploySha, setDeploySha] = useState(null);
  const dirty = text !== null;

  useEffect(() => {
    if (isNew) return;
    gh(`/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${BRANCH}`)
      .then(data => { setText(b64decode(data.content)); setSha(data.sha); })
      .catch(err => setError(err.message));
  }, [path]);

  async function save() {
    const target = isNew ? `src/posts/${filename.replace(/\.md$/, '')}.md` : path;
    if (isNew && !filename.trim()) { setError('Filename required'); return; }
    setStatus('Saving…'); setError('');
    try {
      const data = await gh(`/repos/${OWNER}/${REPO}/contents/${target}`, {
        method: 'PUT',
        body: JSON.stringify({
          message: `${isNew ? 'Add' : 'Update'} ${target} via admin`,
          content: b64encode(text),
          branch: BRANCH,
          ...(sha ? { sha } : {}),
        }),
      });
      setSha(data.content.sha);
      setStatus(`Saved ${new Date().toLocaleTimeString()}`);
      setDeploySha(data.commit.sha);
      onSaved(target, text);
    } catch (err) {
      setStatus(''); setError(err.message);
    }
  }

  return html`
    <div>
      <div class="toolbar">
        <button onClick=${onBack}>← Back</button>
        ${isNew
          ? html`<input type="text" placeholder="post-slug" value=${filename}
              onInput=${e => setFilename(e.target.value)} />`
          : html`<span>${path}</span>`}
        <button onClick=${() => setPreview(p => !p)} disabled=${!dirty}>
          ${preview ? 'Edit' : 'Preview'}</button>
        <button onClick=${save} disabled=${!dirty}>Save</button>
        ${error
          ? html`<span class="status error">${error}</span>`
          : html`<span class="status">${status}</span>`}
        <${DeployStatus} sha=${deploySha} />
      </div>
      ${text === null
        ? html`<p>Loading…</p>`
        : preview
          ? html`<div class="preview"
              dangerouslySetInnerHTML=${{ __html: marked.parse(parsePost(text).body) }}></div>`
          : html`<textarea class="editor" value=${text}
              onInput=${e => setText(e.target.value)}></textarea>`}
    </div>`;
}

function App() {
  const [token, setToken] = useState(getToken());
  const [files, setFiles] = useState(null);
  const [loaded, setLoaded] = useState(0);
  const [view, setView] = useState({ name: 'list' });
  const [error, setError] = useState('');

  const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '');

  async function loadFiles() {
    setError('');
    try {
      const tree = await gh(`/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
      const posts = tree.tree
        .filter(item => item.type === 'blob'
          && POST_DIRS.some(d => item.path.startsWith(d + '/'))
          && item.path.endsWith('.md'))
        .map(item => ({
          path: item.path,
          name: item.path.split('/').pop(),
          dir: item.path.split('/').slice(0, -1).join('/'),
        }))
        .sort((a, b) => a.name.localeCompare(b.name));
      setFiles(posts);
      setLoaded(0);
      await loadContents(posts);
    } catch (err) {
      if (String(err).includes('401')) { localStorage.removeItem('gh_token'); setToken(''); }
      setError(err.message);
    }
  }

  // Bulk-fetch post contents in chunks of aliased GraphQL blob queries,
  // enriching the list with title/date/search text as each chunk arrives.
  async function loadContents(posts) {
    const CHUNK = 100;
    for (let i = 0; i < posts.length; i += CHUNK) {
      const chunk = posts.slice(i, i + CHUNK);
      const fields = chunk.map((f, j) =>
        `f${j}: object(expression: "${BRANCH}:${f.path}") { ... on Blob { text } }`);
      const data = await ghGraphQL(
        `query { repository(owner: "${OWNER}", name: "${REPO}") { ${fields.join(' ')} } }`);
      const parsed = new Map(chunk.map((f, j) => {
        const text = data.repository[`f${j}`]?.text;
        return [f.path, text != null ? parsePost(text) : {}];
      }));
      setLoaded(n => n + chunk.length);
      setFiles(prev => prev
        .map(f => parsed.has(f.path) ? { ...f, ...parsed.get(f.path) } : f)
        .sort(byDateDesc));
    }
  }

  useEffect(() => { if (token) loadFiles(); }, [token]);

  function saveToken(t) { localStorage.setItem('gh_token', t); setToken(t); }
  function logout() { localStorage.removeItem('gh_token'); setToken(''); setFiles(null); }

  return html`
    <div>
      <h1><a href="/">Fallible</a> Admin
        ${token && html` <button style="float:right" onClick=${logout}>Forget token</button>`}
      </h1>
      ${error && html`<p class="status error">${error}</p>`}
      ${!token
        ? html`<${TokenForm} onSave=${saveToken} />`
        : view.name === 'list'
          ? files === null
            ? html`<p>Loading posts…</p>`
            : html`<${FileList} files=${files} loaded=${loaded}
                onOpen=${path => setView({ name: 'edit', path })}
                onNew=${() => setView({ name: 'new' })} />`
          : html`<${Editor} path=${view.path} isNew=${view.name === 'new'}
              onBack=${() => setView({ name: 'list' })}
              onSaved=${(path, text) => {
                const entry = {
                  path,
                  name: path.split('/').pop(),
                  dir: path.split('/').slice(0, -1).join('/'),
                  ...parsePost(text),
                };
                setFiles(prev => [...prev.filter(f => f.path !== path), entry].sort(byDateDesc));
                setLoaded(n => n + (files.some(f => f.path === path) ? 0 : 1));
              }} />`}
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
